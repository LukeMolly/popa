name: Apply legacy member passwords
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-legacy-passwords.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply release
        run: |
          echo '' | base64 -d | tar -xzf -
          git rm .github/workflows/apply-legacy-passwords.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db/postgres.sql scripts/migrate-postgres.mjs lib/member-auth.ts app/account/page.tsx app/api/member-session/route.ts app/member-login/member-login-client.tsx app/api/member-password/route.ts app/change-password/page.tsx app/change-password/change-password-client.tsx
          git commit -m 'Add temporary passwords for legacy members'
          git push
