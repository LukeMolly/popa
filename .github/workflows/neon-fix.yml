name: Apply Neon fix
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/f.patch
          git apply --index /tmp/f.patch
          git rm .github/workflows/neon-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Neon production queries'
          git push
