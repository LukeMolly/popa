name: Apply email password authentication
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-email-password.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply release
        run: |
          echo '' | base64 -d | tar -xzf -
          git rm .github/workflows/deploy-email-password.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db/postgres.sql lib/member-auth.ts app
          git commit -m 'Add secure member email and password login'
          git push
