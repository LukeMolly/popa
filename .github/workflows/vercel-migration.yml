name: Apply Vercel migration
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/vercel-migration.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified migration
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/popa.patch
          git apply --index /tmp/popa.patch
          git rm .github/workflows/vercel-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Migrate Township Rollers portal to Vercel'
          git push
